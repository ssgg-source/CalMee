name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: node scripts/version.mjs --check
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit --incremental false
      - run: pnpm run build

  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
      - name: Create source-check sidecar placeholders
        run: |
          mkdir -p frontend/src-tauri/binaries
          touch frontend/src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          touch frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
      - run: cargo check -p calmee --features coreml --no-default-features --features platform-default
        env:
          CALMEE_SKIP_FFMPEG_BUNDLE: '1'

  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile funasr_sidecar/main.py
